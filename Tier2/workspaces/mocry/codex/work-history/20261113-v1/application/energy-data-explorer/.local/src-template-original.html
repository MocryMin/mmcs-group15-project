<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>MMCS 日度数据行情</title>
<style>
:root { color-scheme:dark; --bg:#0d131e; --panel:#141d2c; --text:#e4ebf5; --muted:#9caabd; --edge:#2a374b; --blue:#55b7ef; --orange:#f5b65c; --purple:#c19bff; }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
main{max-width:1920px;margin:auto;padding:18px 24px 8px} header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px} h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.03em} .sub{color:var(--muted);font-size:12px;margin-top:6px}.tag{color:#acbdd3;font-size:12px;border:1px solid var(--edge);padding:5px 8px;border-radius:4px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}.sep{width:1px;height:23px;background:var(--edge);margin:0 6px} button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--edge);border-radius:4px;min-height:32px;padding:5px 9px} button{cursor:pointer;white-space:nowrap} button:hover,select:hover{border-color:#6585ad} button[aria-pressed=true],button.active{background:#273f5c;border-color:#7cafd5;color:#fff} input[type=date]{min-width:145px} select{max-width:190px} label{display:flex;gap:7px;align-items:center;color:#bfccdd;white-space:nowrap;font-size:13px} input[type=checkbox]{min-height:auto;accent-color:#70b8e6} .right{margin-left:auto} .range-status{font-variant-numeric:tabular-nums;color:#b7c7da;font-size:12px}.error{min-height:18px;color:#ffb4ad;font-size:12px;margin:2px 0}
.quote{display:flex;gap:28px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:10px 0 11px;margin-top:7px;font-variant-numeric:tabular-nums}.quote .date{min-width:110px}.label{font-size:11px;color:var(--muted);margin-bottom:3px}.value{font-size:18px;font-weight:500}.unit{font-size:11px;color:var(--muted);margin-left:5px}.quality{font-size:11px;color:var(--muted);margin-left:auto}.series{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.g{background:var(--blue)}.d{background:var(--orange)}.p{background:var(--purple)}
#chart{height:calc(100vh - 282px);min-height:540px;width:100%} .help{font-size:12px;color:var(--muted);line-height:1.7;padding-top:5px}.help strong{font-weight:500;color:#c1d0e1}.help span{margin-right:17px} .source{font-size:11px;color:#8294ac;padding-top:4px;padding-bottom:8px}.modebar{background:transparent!important} a{color:#9ec9e7}
@media(max-width:1050px){main{padding:14px 12px}.right{margin-left:0}.quote{gap:18px}.quality{margin-left:0} #chart{height:670px}.controls{gap:6px} .sep{margin:0 2px}}
@media(max-width:600px){.tag{display:none}.quote{gap:12px}.value{font-size:16px}.quote .date{min-width:100px}.sep{display:none}.right{width:100%}#chart{height:760px}.controls label{font-size:12px}}
</style>
<script>__PLOTLY_BUNDLE__</script>
</head>
<body>
<main>
 <header><div><h1>MMCS · 日度数据行情</h1><div class="sub" id="coverage"></div></div><span class="tag">冻结修复数据 · 与预测实验一致</span></header>
 <div class="controls" aria-label="选择时间区间">
  <button data-days="30">30天</button><button data-days="90">90天</button><button data-days="182">半年</button><button data-days="365">1年</button><button id="all">全部</button>
  <div class="sep"></div><button data-split="train">Train</button><button data-split="validation">Val</button><button data-split="test">Test 一年</button>
  <label>年份 <select id="year" aria-label="跳转年份"><option value="">选择</option></select></label>
  <div class="sep"></div><label>从 <input id="from" type="date" aria-label="开始日期"></label><label>至 <input id="to" type="date" aria-label="结束日期"></label><button id="apply">应用</button><button id="default">还原默认一年</button>
 </div>
 <div class="controls" aria-label="图表操作">
  <label>显示 <select id="mode"><option value="lines+markers">散点＋折线</option><option value="markers">仅散点</option><option value="lines">仅折线</option></select></label>
  <label>均线 <select id="ma"><option value="0">关闭</option><option value="7">7日均线</option><option value="30">30日均线</option></select></label>
  <div class="sep"></div><button id="pan" aria-pressed="true">拖动平移</button><button id="zoom" aria-pressed="false">框选放大</button>
  <label><input id="autoY" type="checkbox" checked>Y轴随区间</label><label><input id="splitBands" type="checkbox">训练划分</label><label><input id="qualityMarks" type="checkbox">估算/插值日</label>
  <button id="csv" class="right">导出所选CSV</button><button id="png">导出图片</button><span class="range-status" id="status" aria-live="polite"></span>
 </div>
 <div id="error" class="error" role="status"></div>
 <div class="quote" aria-live="off">
  <div class="date"><div class="label">光标日 / 区间末日</div><div class="value" id="qdate">—</div></div>
  <div><div class="label"><span class="series g"></span>供给</div><span class="value" id="qg">—</span><span class="unit">GW</span></div>
  <div><div class="label"><span class="series d"></span>需求</div><span class="value" id="qd">—</span><span class="unit">GW</span></div>
  <div><div class="label">供需差（供给−需求）</div><span class="value" id="qgap">—</span><span class="unit">GW</span></div>
  <div><div class="label"><span class="series p"></span>电价</div><span class="value" id="qp">—</span><span class="unit">£/MWh</span></div>
  <div id="qquality" class="quality"></div>
 </div>
 <div id="chart" role="img" aria-label="可缩放的日均供给、需求、供需差与电价时间序列。使用上方日期输入也可选择时间范围。"></div>
 <div class="help"><span><strong>滚轮：</strong>缩放</span><span><strong>拖动：</strong>平移或框选</span><span><strong>底部滑块：</strong>拖动区间，或拉动两端</span><span><strong>悬停：</strong>查看当日数值</span><span><strong>双击：</strong>查看全部</span><span><strong>图例：</strong>点击隐藏/显示</span></div>
 <div class="source">日均功率（非日电量）；1 GW＝1,000 MW。供给＝课程总发电＋独立风场。电价为名义 £/MWh。估算/插值标记以日期为单位，不表示当日每一列都经过估算。每日只有一个观测值，按日度散点/折线展示。</div>
</main>
<script id="mmcs-data" type="application/json">__DATA__</script>
<script>
(()=>{
 'use strict';
 const source=JSON.parse(document.getElementById('mmcs-data').textContent), rows=source.rows;
 const $=id=>document.getElementById(id), DAY=86400000, HALF=DAY/2;
 const dates=rows.map(r=>r[0]), times=dates.map(d=>Date.parse(d+'T00:00:00Z'));
 const generation=rows.map(r=>r[1]/1000), demand=rows.map(r=>r[2]/1000), price=rows.map(r=>r[3]), gap=generation.map((v,i)=>v-demand[i]);
 const MIN=times[0],MAX=times.at(-1),dateString=t=>new Date(t).toISOString().slice(0,10), toMs=v=>typeof v==='number'?v:Date.parse(String(v).replace(' ','T')+(String(v).length===10?'T00:00:00Z':(/[Z]|[+-]\d{2}:?\d{2}$/.test(String(v))?'':'Z')));
 const state={lo:Date.parse('2025-09-01T00:00:00Z')-HALF,hi:Date.parse('2026-08-31T00:00:00Z')+HALF,first:0,last:rows.length-1,autoY:true,ma:0,mode:'lines+markers',bands:false,quality:false,dragmode:'pan'};
 const chart=$('chart');
 const splits={train:['2022-01-01','2024-12-31'],validation:['2025-01-01','2025-08-31'],test:['2025-09-01','2026-08-31']};
 const palette={g:'#55b7ef',d:'#f5b65c',p:'#c19bff',positive:'#3fba9b',negative:'#de7b78',muted:'#91a5bd'};
 const fixed=(v,d=3)=>Number(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
 function lowerBound(value){let a=0,b=times.length;while(a<b){const m=(a+b)>>1;if(times[m]<value)a=m+1;else b=m;}return a;}
 function rangeIndices(lo,hi){return [Math.max(0,Math.min(rows.length-1,lowerBound(lo))),Math.max(0,Math.min(rows.length-1,lowerBound(hi+1)-1))];}
 function showQuote(i){
  $('qdate').textContent=dates[i];$('qg').textContent=fixed(generation[i]);$('qd').textContent=fixed(demand[i]);$('qp').textContent=fixed(price[i],2);$('qgap').textContent=(gap[i]>0?'+':'')+fixed(gap[i]);
  $('qgap').style.color=gap[i]>=0?palette.positive:palette.negative;
  $('qquality').textContent=rows[i][6]?'当日未标记估算/插值':'当日含估算/插值修复';
 }
 function trailingMean(values,n){let s=0;return values.map((v,i)=>{s+=v;if(i>=n)s-=values[i-n];return i>=n-1?s/n:null;});}
 function extent(values,includeZero=false){let lo=Math.min(...values),hi=Math.max(...values);if(includeZero){lo=Math.min(0,lo);hi=Math.max(0,hi);}const margin=Math.max((hi-lo)*.10,Math.abs(hi)*.005,.05);return [lo-margin,hi+margin];}
 function yRanges(){const a=state.first,b=state.last+1;let power=generation.slice(a,b).concat(demand.slice(a,b)),prices=price.slice(a,b);if(state.ma){power=power.concat(trailingMean(generation,state.ma).slice(a,b).filter(Number.isFinite),trailingMean(demand,state.ma).slice(a,b).filter(Number.isFinite));prices=prices.concat(trailingMean(price,state.ma).slice(a,b).filter(Number.isFinite));}return {'yaxis.range':extent(power), 'yaxis2.range':extent(gap.slice(a,b),true),'yaxis3.range':extent(prices)};}
 function bandShapes(){
  if(!state.bands)return [];
  return Object.entries(splits).map(([name,r],i)=>({type:'rect',xref:'x',yref:'paper',x0:r[0],x1:dateString(Date.parse(r[1]+'T00:00:00Z')+DAY),y0:0,y1:1,line:{width:0},fillcolor:['rgba(85,183,239,.055)','rgba(245,182,92,.075)','rgba(193,155,255,.075)'][i],layer:'below'}));
 }
 function annotations(){return [
  {text:'供给 / 需求 · GW',x:0,y:1.045,xref:'paper',yref:'paper',showarrow:false,xanchor:'left',font:{color:'#c4d2e5',size:12}},
  {text:'供需差 · GW（正值为盈余，负值为缺口）',x:0,y:.582,xref:'paper',yref:'paper',showarrow:false,xanchor:'left',font:{color:'#aebed2',size:11}},
  {text:'日均电价 · £/MWh',x:0,y:.352,xref:'paper',yref:'paper',showarrow:false,xanchor:'left',font:{color:'#c4d2e5',size:12}}
 ];}
 function currentRangeUI(){
  [state.first,state.last]=rangeIndices(state.lo,state.hi);
  $('from').value=dates[state.first];$('to').value=dates[state.last];
  $('status').textContent=`${dates[state.first]} — ${dates[state.last]} · ${state.last-state.first+1} 天`;
  for(const b of document.querySelectorAll('[data-split]')){const p=splits[b.dataset.split];b.classList.toggle('active',dates[state.first]===p[0]&&dates[state.last]===p[1]);}
  $('year').value='';$('error').textContent='';showQuote(state.last);
 }
 async function setRange(lo,hi,fromPlot=false){
  if(!Number.isFinite(lo)||!Number.isFinite(hi)||lo>hi){$('error').textContent='请选择有效的日期区间，开始日期应不晚于结束日期。';return false;}
  lo=Math.max(MIN-HALF,Math.min(MAX+HALF,lo));hi=Math.max(MIN-HALF,Math.min(MAX+HALF,hi));
  if(hi-lo<DAY){const mid=(lo+hi)/2;lo=Math.max(MIN-HALF,mid-HALF);hi=Math.min(MAX+HALF,lo+DAY);lo=Math.max(MIN-HALF,hi-DAY);}
  const [a,b]=rangeIndices(lo,hi);if(a>b){$('error').textContent='所选区间内没有观测。';return false;}
  state.lo=lo;state.hi=hi;currentRangeUI();
  const update=state.autoY?yRanges():{};
  if(!fromPlot)update['xaxis.range']=[new Date(lo).toISOString(),new Date(hi).toISOString()];
  if(Object.keys(update).length)await Plotly.relayout(chart,update);
  return true;
 }
 function trace(name,y,color,yaxis){return {type:'scatter',name,x:dates,y,yaxis,mode:state.mode,line:{color,width:1},marker:{color,size:4,opacity:.8},hovertemplate:`${name} %{y:,.3f}${yaxis==='y3'?' £/MWh':' GW'}<extra></extra>`};}
 const traces=[trace('供给',generation,palette.g,'y'),trace('需求',demand,palette.d,'y'),
  {type:'bar',name:'供需差',x:dates,y:gap,yaxis:'y2',marker:{color:gap.map(v=>v>=0?palette.positive:palette.negative),line:{width:0}},opacity:.75,hovertemplate:'供需差 %{y:,.3f} GW<extra></extra>'},
  trace('电价',price,palette.p,'y3'),
  {type:'scatter',name:'供给均线',x:dates,y:generation.map(()=>null),yaxis:'y',mode:'lines',line:{color:palette.g,width:2.4},visible:false,hovertemplate:'供给均线 %{y:,.3f} GW<extra></extra>'},
  {type:'scatter',name:'需求均线',x:dates,y:demand.map(()=>null),yaxis:'y',mode:'lines',line:{color:palette.d,width:2.4},visible:false,hovertemplate:'需求均线 %{y:,.3f} GW<extra></extra>'},
  {type:'scatter',name:'电价均线',x:dates,y:price.map(()=>null),yaxis:'y3',mode:'lines',line:{color:palette.p,width:2.4},visible:false,hovertemplate:'电价均线 %{y:,.2f} £/MWh<extra></extra>'},
  {type:'scatter',name:'估算/插值日（日期标记）',x:dates.filter((_,i)=>!rows[i][6]),y:dates.filter((_,i)=>!rows[i][6]).map(()=>0),yaxis:'y4',mode:'markers',marker:{color:palette.muted,symbol:'triangle-up',size:6},visible:false,hovertemplate:'当日含估算或插值修复<extra></extra>'}];
 const axisStyle={gridcolor:'#202c3e',zerolinecolor:'#52627b',tickfont:{color:'#a9bad0',size:11},fixedrange:false,automargin:true};
 const layout={paper_bgcolor:'#0d131e',plot_bgcolor:'#0d131e',font:{family:'Segoe UI, Microsoft YaHei, sans-serif',color:'#d3dfed',size:12},
  margin:{l:66,r:28,t:44,b:20},dragmode:'pan',hovermode:'x unified',hoverdistance:32,spikedistance:-1,
  hoverlabel:{bgcolor:'#1c2a3f',bordercolor:'#4b607d',font:{color:'#eef4fd',size:12}},
  legend:{orientation:'h',x:1,y:1.105,xanchor:'right',yanchor:'bottom',font:{size:11},bgcolor:'rgba(0,0,0,0)'},
  xaxis:{...axisStyle,type:'date',anchor:'y3',range:[new Date(state.lo).toISOString(),new Date(state.hi).toISOString()],tickformat:'%Y-%m-%d',nticks:9,
   showspikes:true,spikecolor:'#8eabc8',spikemode:'across',spikesnap:'cursor',spikethickness:1,
   rangeslider:{visible:true,thickness:.105,bgcolor:'#172235',bordercolor:'#34465f',borderwidth:1,range:[dates[0],dates.at(-1)]}},
  yaxis:{...axisStyle,domain:[.64,1],title:{text:'GW',standoff:5},showspikes:true,spikecolor:'#8eabc8',spikethickness:1},
  yaxis2:{...axisStyle,domain:[.41,.54],title:{text:'GW',standoff:5},zeroline:true},
  yaxis3:{...axisStyle,domain:[.08,.31],title:{text:'£/MWh',standoff:5}},
  yaxis4:{domain:[0,.025],range:[-1,1],visible:false,fixedrange:true},annotations:annotations(),bargap:.18,uirevision:'mmcs-explorer-v1'};
 const config={responsive:true,scrollZoom:true,displaylogo:false,displayModeBar:true,doubleClick:'reset',modeBarButtonsToRemove:['select2d','lasso2d','autoScale2d','resetScale2d'],
  toImageButtonOptions:{format:'png',filename:'mmcs-daily-selection',scale:2}};
 async function init(){
  $('coverage').textContent=`数据范围 ${dates[0]} — ${dates.at(-1)} · ${rows.length.toLocaleString()} 个日观测 · 默认显示测试年份`;
  for(const el of [$('from'),$('to')]){el.min=dates[0];el.max=dates.at(-1);}
  for(let y=Number(dates[0].slice(0,4));y<=Number(dates.at(-1).slice(0,4));y++){$('year').add(new Option(String(y),String(y)));}
  currentRangeUI();Object.entries(yRanges()).forEach(([key,value])=>{const [axis,prop]=key.split('.');layout[axis][prop]=value;});
  await Plotly.newPlot(chart,traces,layout,config);
  chart.on('plotly_relayout',event=>{
   if(event['xaxis.autorange']){setRange(MIN-HALF,MAX+HALF);return;}
   const range=event['xaxis.range']||(event['xaxis.range[0]']!==undefined?[event['xaxis.range[0]'],event['xaxis.range[1]']]:null);
   if(range&&range[1]!==undefined){const lo=toMs(range[0]),hi=toMs(range[1]);if(Number.isFinite(lo)&&Number.isFinite(hi)&&(Math.abs(lo-state.lo)>1||Math.abs(hi-state.hi)>1))setRange(lo,hi,true);}
   if(event.dragmode){state.dragmode=event.dragmode;$('pan').setAttribute('aria-pressed',String(event.dragmode==='pan'));$('zoom').setAttribute('aria-pressed',String(event.dragmode==='zoom'));}
  });
  chart.on('plotly_hover',event=>{const point=event.points.find(p=>p.curveNumber<4);if(point){const i=lowerBound(toMs(point.x));if(i<rows.length)showQuote(i);}});
  chart.on('plotly_doubleclick',()=>{setRange(MIN-HALF,MAX+HALF);return false;});
  for(const b of document.querySelectorAll('[data-days]'))b.addEventListener('click',()=>{const last=times[state.last];setRange(last-(Number(b.dataset.days)-1)*DAY-HALF,last+HALF);});
  for(const b of document.querySelectorAll('[data-split]'))b.addEventListener('click',()=>{const p=splits[b.dataset.split];setRange(toMs(p[0])-HALF,toMs(p[1])+HALF);});
  $('all').onclick=()=>setRange(MIN-HALF,MAX+HALF);
  $('default').onclick=()=>{Plotly.relayout(chart,{dragmode:'pan'});setRange(toMs(splits.test[0])-HALF,toMs(splits.test[1])+HALF);};
  $('apply').onclick=()=>{
   const a=toMs($('from').value),b=toMs($('to').value);
   if(!Number.isFinite(a)||!Number.isFinite(b)||a>b||a<MIN||b>MAX){$('error').textContent=`请选择 ${dates[0]} 至 ${dates.at(-1)} 内的有效日期，开始日期不晚于结束日期。`;return;}
   setRange(a-HALF,b+HALF);
  };
  for(const el of [$('from'),$('to')])el.addEventListener('keydown',e=>{if(e.key==='Enter')$('apply').click();});
  $('year').onchange=()=>{const y=$('year').value;if(y)setRange(Math.max(MIN,toMs(y+'-01-01'))-HALF,Math.min(MAX,toMs(y+'-12-31'))+HALF);};
  $('mode').onchange=()=>{state.mode=$('mode').value;Plotly.restyle(chart,{mode:state.mode},[0,1,3]);};
  $('ma').onchange=async()=>{state.ma=Number($('ma').value);if(!state.ma){await Plotly.restyle(chart,{visible:false},[4,5,6]);}
   else{const ys=[generation,demand,price].map(v=>trailingMean(v,state.ma));await Plotly.restyle(chart,{y:ys,visible:true,name:[`供给 MA${state.ma}`,`需求 MA${state.ma}`,`电价 MA${state.ma}`]},[4,5,6]);}if(state.autoY)await Plotly.relayout(chart,yRanges());};
  $('pan').onclick=()=>Plotly.relayout(chart,{dragmode:'pan'});$('zoom').onclick=()=>Plotly.relayout(chart,{dragmode:'zoom'});
  $('autoY').onchange=()=>{state.autoY=$('autoY').checked;if(state.autoY)Plotly.relayout(chart,yRanges());};
  $('splitBands').onchange=()=>{state.bands=$('splitBands').checked;Plotly.relayout(chart,{shapes:bandShapes()});};
  $('qualityMarks').onchange=()=>{state.quality=$('qualityMarks').checked;Plotly.restyle(chart,{visible:state.quality},[7]);};
  $('csv').onclick=()=>{
   const header='date,generation_MW,demand_MW,price_GBP_MWh,source_total_MW,wind_farm_MW,strict_no_imputation';
   const content='\uFEFF'+header+'\r\n'+rows.slice(state.first,state.last+1).map(r=>r.map((v,i)=>i===6?(v?'True':'False'):v).join(',')).join('\r\n');
   const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download=`MMCS_${dates[state.first]}_${dates[state.last]}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  $('png').onclick=()=>Plotly.downloadImage(chart,{format:'png',filename:`MMCS_${dates[state.first]}_${dates[state.last]}`,scale:2});
  window.MMCS_VIEW={ready:true,source:source.metadata,getState:()=>({...state,firstDate:dates[state.first],lastDate:dates[state.last],count:state.last-state.first+1}),
   setDates:async(a,b)=>setRange(toMs(a)-HALF,toMs(b)+HALF),getVisibleRows:()=>rows.slice(state.first,state.last+1),resetDefault:()=>setRange(toMs(splits.test[0])-HALF,toMs(splits.test[1])+HALF)};
 }
 init().catch(error=>{$('error').textContent='图表未能加载：'+error.message;console.error(error);});
})();
</script>
</body>
</html>
